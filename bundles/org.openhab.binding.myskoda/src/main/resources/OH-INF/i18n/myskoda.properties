# add-on

addon.myskoda.name = MyŠkoda Binding
addon.myskoda.description = This is the binding for Škoda connected cars using the official MyŠkoda public API.

# thing types

thing-type.myskoda.account.label = MyŠkoda Account
thing-type.myskoda.account.description = A MyŠkoda API key, generated in the MySkoda mobile app. One key can cover several vehicles.
thing-type.myskoda.vehicle.label = MyŠkoda Vehicle
thing-type.myskoda.vehicle.description = A Škoda vehicle registered to a MyŠkoda account. Not every channel is populated for every vehicle - which groups report data depends on the vehicle's drivetrain and equipment.

# thing types config

thing-type.config.myskoda.account.apiKey.label = API Key
thing-type.config.myskoda.account.apiKey.description = API key created in the MyŠkoda app (open https://go.skoda.eu/api-keys on the phone with the app installed). A key is bound to the vehicles selected when it was created and expires; create a new one in the app when it does.
thing-type.config.myskoda.vehicle.refreshInterval.label = Refresh Interval
thing-type.config.myskoda.vehicle.refreshInterval.description = Interval the vehicle is polled in minutes. The API allows only 20 requests/hour per vehicle, and every poll and every command counts against that, so keep this conservative.
thing-type.config.myskoda.vehicle.sPin.label = Security PIN
thing-type.config.myskoda.vehicle.sPin.description = Vehicle security PIN (S-PIN), required only to start auxiliary heating.
thing-type.config.myskoda.vehicle.vin.label = VIN
thing-type.config.myskoda.vehicle.vin.description = Vehicle Identification Number.

# channel group types

channel-group-type.myskoda.active-ventilation-values.label = Active Ventilation
channel-group-type.myskoda.active-ventilation-values.description = The vehicle's active ventilation.
channel-group-type.myskoda.auxiliary-heating-values.label = Auxiliary Heating
channel-group-type.myskoda.auxiliary-heating-values.description = The vehicle's fuel-operated or electric auxiliary heater. Starting it requires the vehicle's security PIN, configured on the vehicle thing.
channel-group-type.myskoda.charging-values.label = Charging
channel-group-type.myskoda.charging-values.description = Charging and battery status. Only reported for vehicles that support charging (battery-electric and plug-in hybrid). Of the charging settings, only the target state of charge and the preferred charge mode can be changed through the public API; the others are read-only.
channel-group-type.myskoda.climate-values.label = Climate
channel-group-type.myskoda.climate-values.description = Air conditioning state and window heating.
channel-group-type.myskoda.fuel-values.label = Fuel & Range
channel-group-type.myskoda.fuel-values.description = Fuel level and driving range. Only reported for vehicles with a combustion engine, including hybrids - battery-electric vehicles report state of charge and range under Charging instead. The secondary engine channels are only populated for plug-in hybrids.
channel-group-type.myskoda.odometer-values.label = Odometer
channel-group-type.myskoda.odometer-values.description = Current mileage of the vehicle.
channel-group-type.myskoda.position-values.label = Position
channel-group-type.myskoda.position-values.description = Last known parking position. When the vehicle is in motion, no coordinates or address are reported.
channel-group-type.myskoda.status-values.label = Vehicle Status
channel-group-type.myskoda.status-values.description = Doors, windows, lights and lock status.

